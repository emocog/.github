name: 버그 리포트
description: 재현 절차, 기대 결과, 실제 결과를 나눠 버그를 보고합니다.
title: '[버그] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        무엇이 잘못되었는지에 대한 명확한 세부 정보를 제공하여 버그를 해결하도록 도와주세요.

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 화면에 보인 문구와 그 직후 앱 상태를 적습니다.
      placeholder: ○○ 화면에서 멈추고, ○○ 문구가 나타납니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      placeholder: ○○ 화면으로 이동하고, ○○ 문구가 보여야 합니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 앱을 켠 직후처럼 공통된 시작 지점부터 번호를 붙입니다.
      placeholder: |
        1. 앱을 실행하고 ○○ 화면에 들어갑니다.
        2. ○○ 버튼을 누릅니다.
        3. ○○ 메시지가 나타납니다.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 앱 설정의 버전정보와, 증상을 본 기기를 적습니다. 워치가 관련된 경우에만 워치 줄을 채웁니다.
      placeholder: |
        앱 버전: 1.2.0
        기기: Galaxy S24 / Android 15
        서버: dev
        워치: 없음
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 화면 또는 로그
      description: 있으면 첨부합니다. 식별 정보와 토큰은 가리거나 지웁니다.
